<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="title desc">
<title id="title">The intended path from request to completed change</title>
<desc id="desc">Describe and plan, approve tasks, then implement and review. Inspect evidence and decide before merging. Automation is designed, not operational.</desc>
<rect width="760" height="268" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="34" font-size="17" font-weight="bold">Human decisions gate the work</text>
<text x="28" y="57" font-size="13" fill="#475569">Designed workflow · automated execution is not available yet</text>
<g stroke="#64748b" stroke-width="2" fill="none"><path d="M236 116h24m-6-5 6 5-6 5M496 116h24m-6-5 6 5-6 5M624 146v28H136v12m-5-6 5 6 5-6M236 218h24m-6-5 6 5-6 5M496 218h24m-6-5 6 5-6 5"/></g>
<rect x="28" y="84" width="208" height="62" rx="9" fill="#e2e8f0"/>
<rect x="260" y="84" width="236" height="62" rx="9" fill="#dbeafe"/>
<rect x="520" y="84" width="212" height="62" rx="9" fill="#e2e8f0"/>
<rect x="28" y="186" width="208" height="62" rx="9" fill="#e2e8f0"/>
<rect x="260" y="186" width="236" height="62" rx="9" fill="#dbeafe"/>
<rect x="520" y="186" width="212" height="62" rx="9" fill="#dcfce7"/>
<g text-anchor="middle" font-size="16" font-weight="bold">
<text x="132" y="110">1. Describe &amp; plan</text><text x="378" y="110">2. Approve tasks</text><text x="626" y="110">3. Implement</text>
<text x="132" y="212">4. Review</text><text x="378" y="212">5. Inspect &amp; decide</text><text x="626" y="212">6. Merge</text>
</g>
<g text-anchor="middle" font-size="13" fill="#334155"><text x="132" y="132">You + main agent</text><text x="378" y="132">You</text><text x="626" y="132">Worker</text><text x="132" y="234">Independent reviewer</text><text x="378" y="234">You + evidence</text><text x="626" y="234">Task becomes done</text></g>
</g></svg>
